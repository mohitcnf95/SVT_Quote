<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<style>
  body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
  button { padding: 16px 32px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; }
  .t1 { background: #1877f2; color: white; }
  .t2 { background: #2e7d32; color: white; }
  .t3 { background: #e53935; color: white; }
  #log { margin-top: 20px; background: white; padding: 16px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; min-height: 100px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>pdfmake Download Test</h2>
<p>Tap each button and report which ones work:</p>

<button class="t1" onclick="test1()">Test 1: pdfmake.open()</button>
<button class="t2" onclick="test2()">Test 2: Blob + anchor click</button>
<button class="t3" onclick="test3()">Test 3: Base64 data URI</button>

<div id="log">Tap a button to start test...\n</div>

<script>
var log = document.getElementById("log");
function lg(msg) { log.textContent += msg + "\n"; }

var dd = {
  content: [
    { text: "SIDDHI VINAYAK TRADERS", fontSize: 16, bold: true, alignment: "center" },
    { text: "Test PDF - SVT Document System", fontSize: 12, margin: [0, 10, 0, 10] },
    { text: "If you can see this PDF, that method works!", fontSize: 10 }
  ]
};

function test1() {
  lg("Test 1: Trying pdfmake.open()...");
  try {
    pdfMake.createPdf(dd).open();
    lg("Test 1: open() called — check if new tab opened");
  } catch(e) {
    lg("Test 1 ERROR: " + e.message);
  }
}

function test2() {
  lg("Test 2: Trying Blob + anchor...");
  try {
    pdfMake.createPdf(dd).getBlob(function(blob) {
      lg("Test 2: Got blob, size=" + blob.size);
      try {
        var url = URL.createObjectURL(blob);
        lg("Test 2: Blob URL created: " + url.substring(0,40));
        var a = document.createElement("a");
        a.href = url;
        a.download = "svt_test.pdf";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        lg("Test 2: anchor.click() called");
        setTimeout(function() {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          lg("Test 2: cleanup done — did file download?");
        }, 2000);
      } catch(e2) {
        lg("Test 2 inner ERROR: " + e2.message);
      }
    });
  } catch(e) {
    lg("Test 2 ERROR: " + e.message);
  }
}

function test3() {
  lg("Test 3: Trying Base64 data URI...");
  try {
    pdfMake.createPdf(dd).getBase64(function(b64) {
      lg("Test 3: Got base64, length=" + b64.length);
      try {
        var a = document.createElement("a");
        a.href = "data:application/pdf;base64," + b64;
        a.download = "svt_test.pdf";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        lg("Test 3: anchor.click() called — did file download?");
        setTimeout(function() { document.body.removeChild(a); }, 2000);
      } catch(e2) {
        lg("Test 3 inner ERROR: " + e2.message);
      }
    });
  } catch(e) {
    lg("Test 3 ERROR: " + e.message);
  }
}
</script>
</body>
</html>
